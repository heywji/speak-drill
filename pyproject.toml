[project]
name = "speak-drill"
version = "0.1.0"
description = "英语跟读发音练习：say 领读 → 你读 → 本地 Whisper 逐词比对，配口腔侧剖面发音动画"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.4",
    "numpy",
    "requests",
    "cmudict>=1.1.3",
]

[project.scripts]
speak-drill = "speak_drill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
