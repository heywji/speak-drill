<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Drill · 登录</title>
<style>
:root { --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e4e2dc; --accent: #2f6fde; --bad: #d64545; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa0; --line: #2e2e33; --accent: #5b8cff; --bad: #ff6b6b; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
h1 { font-size: 19px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
button { width: 100%; margin-top: 12px; font: inherit; border: 0; border-radius: 10px; padding: 10px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 8px; }
</style>
</head>
<body>
<form id="f">
  <h1>🎙 Speak Drill</h1>
  <p>跟读发音练习，输入密码进入</p>
  <input type="password" id="pw" placeholder="密码" autocomplete="current-password" autofocus required>
  <button id="go">进入</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    const d = await r.json();
    if (d.ok) { location.href = "/"; return; }
    err.textContent = d.error || "登录失败";
  } catch (x) {
    err.textContent = "连不上服务器：" + x.message;
  }
  go.disabled = false;
};
</script>
</body>
</html>
